  <g filter="url(#cardShadow)">    <rect x="402" y="114" width="316" height="290" rx="16" fill="url(#coreGrad)" stroke="#4338CA" stroke-width="2"/>    <rect x="420" y="132" width="280" height="34" rx="9" fill="#4338CA"/>    <text x="560" y="154" text-anchor="middle" style="font-family:'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;font-size:15px;font-weight:700;fill:#FFFFFF;">群间 · Chat Dynamics（核心主控）</text>    <text x="560" y="186" text-anchor="middle" class="c-sub">astrbot_plugin_chat_dynamics</text>    <line x1="422" y1="200" x2="698" y2="200" stroke="#A5B4FC" stroke-width="1"/>    <text x="426" y="224" class="c-body">· 统一接管防抖聚合、话题路由与参与决策</text>    <text x="426" y="247" class="c-body">· 唯一发言权与自然段节奏交付总控</text>    <text x="426" y="270" class="c-body">· 通过宿主公开注册表发现伙伴，零库互读</text>    <text x="426" y="293" class="c-body">· 只读组合多插件投影，送达后分发回执</text>    <text x="426" y="316" class="c-body">· 任一伙伴缺失均优雅降级，支持按需选装</text>    <rect x="420" y="338" width="280" height="48" rx="10" fill="#FFFFFF" stroke="#A5B4FC"/>    <text x="560" y="358" text-anchor="middle" class="c-chip" fill="#4338CA">能力协议总线 · SeriesHub</text>    <text x="560" y="376" text-anchor="middle" class="c-sub">world v1 · memory v1 · social · horizons · visual</text>  </g>
  <g filter="url(#cardShadow)">    <rect x="402" y="424" width="316" height="116" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>    <text x="560" y="450" text-anchor="middle" class="c-title" fill="#1E293B">Series Panel v2 统一控制台</text>    <text x="422" y="474" class="c-body">· 单行双层导航栏 + 2×4 实时状态矩阵</text>    <text x="422" y="495" class="c-body">· 跨页会话（UMO）同步与健康冲突提示</text>    <text x="422" y="516" class="c-body">· 全局 Ctrl+K / ⌘K 联邦搜索与日夜主题</text>  </g>
