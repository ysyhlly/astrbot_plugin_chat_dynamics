<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paint the document canvas before any external resource can delay navigation. -->
    <style>
      html { background: #f5f6f4; color-scheme: light; }
      html[data-ui-theme="night"] { background: #0b1419; color-scheme: dark; }
    </style>
    <script>
      (() => {
        const valid = value => value === "day" || value === "night";
        const query = new URLSearchParams(location.search).get("ui");
        let saved;
        try { saved = localStorage.getItem("chat_dynamics_ui"); } catch {}
        document.documentElement.dataset.uiTheme = valid(query) ? query : valid(saved) ? saved : "day";
      })();
    </script>
    <!-- chat_dynamics_ui: shared controls and account preference -->
    <script src="./theme.js">
</script>
    <title>今日读空气</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./plugin_nav.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
<div class="app wire-app plugin-shell">
<div class="plugin-layout">
<aside class="plugin-side" aria-label="插件页面">
<p class="plugin-side-label">群聊动态</p>
<nav id="pluginSideNav" class="plugin-side-nav" aria-label="插件页面导航">
</nav>
</aside>
<main class="plugin-main today-workspace">
<header class="topbar">
<div class="brand-copy">
<p class="eyebrow">CHAT DYNAMICS / TODAY</p>
<h1 id="pageTitle">今日读空气</h1>
<p class="lede" id="pageDesc">了解当下氛围，查看参与情况与最近的决策。</p>
</div>
<div class="topbar-tools">
<div class="connection-state" role="status" aria-live="polite">
<span class="status-dot" id="linkLamp" aria-hidden="true">
</span>
<span id="linkLabel">正在连接</span>
</div>
<button type="button" class="button button-quiet" id="btnRefresh">刷新</button>
</div>
</header>
<section class="wire-card session-toolbar">
<label for="sessionSelect">观察会话<select id="sessionSelect">
</select>
</label>
<span class="card-note" id="emptyHint">
</span>
</section>
<div class="overview-grid">
<section class="wire-card atmosphere" aria-labelledby="occasionTitle">
<p class="eyebrow">当前氛围</p>
<h2 id="occasionTitle">此刻，群里怎么样</h2>
<div id="occasionCapsule" class="capsule">—</div>
<p class="one-liner" id="oneLiner">正在读取氛围…</p>
</section>
<section class="wire-card" aria-labelledby="thermoTitle">
<div class="card-heading">
<h2 id="thermoTitle">参与概况</h2>
<span class="card-note" id="knobTarget">目标：—</span>
</div>
<p class="section-copy">安静旁听与主动插话的当前比例</p>
<div class="thermometer">
<div class="thermo-track" role="meter" aria-label="插话占比" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
<div class="thermo-fill" id="thermoFill">
</div>
</div>
<div class="thermo-labels">
<span id="thermoQuiet">安静 —</span>
<span id="thermoIntervene">插话 —</span>
</div>
</div>
<p class="section-copy">全局参与档位 · 保存后持续生效</p>
<div class="tonight-actions">
<button type="button" class="button" id="btnGhostTonight" disabled>隐身</button>
<button type="button" class="button" id="btnSensibleTonight" disabled>懂事</button>
<button type="button" class="button" id="btnLivelyTonight" disabled>活跃</button>
</div>
<button type="button" class="button button-quiet" id="btnMuteTonight" disabled>当前会话 · 10 小时不提记忆</button>
<p class="ops-note" id="tonightNote" role="status" aria-live="polite">
</p>
</section>
</div>
<div class="detail-grid">
<section class="wire-card" aria-labelledby="whyTitle">
<div class="card-heading">
<h2 id="whyTitle">最近为什么没回</h2>
<span class="card-note">最近 5 条 · 无消息原文</span>
</div>
<ul class="decision-list" id="decisionList">
</ul>
<div class="empty-state hidden" id="decisionEmpty">还没有决策记录，等待会话产生新的活动。</div>
</section>
<section class="wire-card">
<div class="card-heading">
<h2>协作与作息</h2>
</div>
<div class="partner-sheet" id="partnerSheet" aria-live="polite">
</div>
</section>
</div>
</main>
</div>
</div>
<script type="module" src="./app.js">
</script>
</body>
</html>
