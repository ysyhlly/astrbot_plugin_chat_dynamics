<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paint the document canvas before any external resource can delay navigation. -->
    <style>
      html { background: #f5f6f4; color-scheme: light; }
      html[data-ui-theme="night"] { background: #0b1419; color-scheme: dark; }
    </style>
    <script>
      (() => {
        const valid = value => value === "day" || value === "night";
        const query = new URLSearchParams(location.search).get("ui");
        let saved;
        try { saved = localStorage.getItem("chat_dynamics_ui"); } catch {}
        document.documentElement.dataset.uiTheme = valid(query) ? query : valid(saved) ? saved : "day";
      })();
    </script>
    <!-- chat_dynamics_ui: shared controls and account preference -->
    <script src="./theme.js">
</script>
    <title>分寸台</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./plugin_nav.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
<div class="app wire-app plugin-shell">
<div class="plugin-layout">
<aside class="plugin-side" aria-label="插件页面">
<p class="plugin-side-label">群聊动态</p>
<nav id="pluginSideNav" class="plugin-side-nav" aria-label="插件页面导航">
</nav>
</aside>
<main class="plugin-main manners-workspace">
<header class="topbar">
<div class="brand-copy">
<p class="eyebrow">CHAT DYNAMICS / MANNERS</p>
<h1 id="pageTitle">分寸台</h1>
<p class="lede" id="pageDesc">调整所有会话的参与方式。开关即时保存，参与档位需点击应用。</p>
</div>
<div class="topbar-tools">
<div class="connection-state" role="status" aria-live="polite">
<span class="status-dot" id="linkLamp" aria-hidden="true">
</span>
<span id="linkLabel">正在连接</span>
</div>
<button type="button" class="button button-quiet" id="btnRefresh">刷新</button>
</div>
</header>
<div class="scope-banner">
<strong>全局设置</strong>
<span>以下设置作用于所有会话；单个会话的记忆操作请在记忆小本中进行。</span>
</div>
<section class="wire-card presence-card" aria-labelledby="presenceTitle">
<div>
<p class="eyebrow">参与方式</p>
<h2 id="presenceTitle">给聊天留多少空间</h2>
<p class="one-liner" id="presencePreview">懂场合再接话，默认推荐。</p>
</div>
<div class="presence-slider">
<label for="presenceRange" class="section-copy">全局存在感</label>
<input id="presenceRange" type="range" min="0" max="2" step="1" value="1" aria-valuetext="懂事"/>
<div class="presence-marks">
<span data-v="ghost">隐身</span>
<span data-v="sensible" class="active">懂事</span>
<span data-v="lively">活跃</span>
</div>
<button type="button" class="button button-primary" id="btnSavePresence" disabled>应用参与档位</button>
<p class="ops-note" id="presenceNote" role="status" aria-live="polite">
</p>
</div>
</section>
<section class="wire-card" aria-labelledby="socialTitle">
<div class="card-heading">
<h2 id="socialTitle">社交与作息</h2>
<span class="card-note">点击开关即时保存</span>
</div>
<div class="settings-grid" id="socialChips">
</div>
</section>
<section class="wire-card" aria-labelledby="mediaTitle">
<div class="card-heading">
<h2 id="mediaTitle">图片与语音</h2>
<span class="card-note">理解接话默认关闭</span>
</div>
<div class="settings-grid" id="mediaChips">
</div>
</section>
<p class="ops-note save-feedback" id="chipNote" role="status" aria-live="polite"></p>
<section class="wire-card">
<h2>继续管理</h2>
<p class="section-copy">模型、防抖与其他详细参数在侧栏「插件参数配置」中。需要管理某个会话的纪念日、约定或试用梗，请打开「记忆小本」。</p>
</section>
</main>
</div>
</div>
<script type="module" src="./app.js">
</script>
</body>
</html>
