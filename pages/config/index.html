<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paint the document canvas before any external resource can delay navigation. -->
    <style>
      html { background: #f5f6f4; color-scheme: light; }
      html[data-ui-theme="night"] { background: #0b1419; color-scheme: dark; }
    </style>
    <script>
      (() => {
        const valid = value => value === "day" || value === "night";
        const query = new URLSearchParams(location.search).get("ui");
        let saved;
        try { saved = localStorage.getItem("chat_dynamics_ui"); } catch {}
        document.documentElement.dataset.uiTheme = valid(query) ? query : valid(saved) ? saved : "day";
      })();
    </script>
    <!-- chat_dynamics_ui: shared controls and account preference -->
    <script src="./theme.js"></script>
    <title>插件参数配置</title>
    <link rel="stylesheet" href="./plugin_nav.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="app plugin-shell">
      <div class="plugin-layout">
        <aside class="plugin-side" aria-label="插件页面">
          <p class="plugin-side-label">群聊动态</p>
          <nav id="pluginSideNav" class="plugin-side-nav" aria-label="插件页面导航"></nav>
        </aside>
        <div class="plugin-main">
      <header class="topbar">
        <div class="brand-copy">
          <p class="eyebrow">WORKSPACE / SETTINGS</p>
          <h1 id="pageTitle">参数配置</h1>
          <p class="lede" id="pageDesc">定义参与范围，调整每一次回应。</p>
        </div>
        <div class="topbar-tools">
          <nav class="page-nav" id="pageNav" aria-label="插件子页切换"></nav>
          <div class="connection-state" role="status" aria-live="polite">
            <span class="status-dot" id="linkLamp" aria-hidden="true"></span><span id="linkLabel">连接中</span>
          </div>
        </div>
      </header>

      <div class="action-bar" role="region" aria-label="配置操作">
        <div class="action-copy">
          <strong id="actionTitle">所有修改已保存</strong>
          <p class="ops-note" id="configNote" role="status" aria-live="polite"></p>
        </div>
        <div class="action-buttons">
          <button type="button" class="button button-quiet" id="btnConfigReload">重新读取</button>
          <button type="button" class="button" id="btnConfigApply">强制应用</button>
          <button type="button" class="button button-primary" id="btnConfigSave" disabled>保存并应用</button>
        </div>
      </div>

      <main class="content">
        <section class="config-start" aria-labelledby="configStartTitle">
          <div>
            <p class="eyebrow">运行范围</p>
            <h2 id="configStartTitle">先从一个群聊开始</h2>
            <p id="configScopeStatus" role="status" aria-live="polite">正在读取生效范围…</p>
          </div>
          <p class="scope-guide">选择群聊后即可保存。模型留空时沿用默认设置，细节参数可以稍后调整。</p>
        </section>
        <div class="settings-workspace">
          <aside class="settings-index" aria-label="设置目录">
            <div class="config-mode" role="group" aria-label="设置复杂度">
              <button type="button" class="button" id="btnBasicConfig" aria-pressed="true">常用</button>
              <button type="button" class="button button-quiet" id="btnAdvancedConfig" aria-pressed="false">全部</button>
            </div>
            <p class="index-label">设置分类</p>
            <nav id="configCategoryNav" aria-label="配置分类导航"></nav>
          </aside>
          <div class="settings-editor">
        <div class="config-toolbar">
          <label class="config-search">搜索全部设置<input id="configSearch" type="search" placeholder="搜索名称、说明或参数名" autocomplete="off" /></label>
          <label class="config-category">快速跳转<select id="configCategory"><option value="">正在读取分类…</option></select></label>
          <div class="config-view-actions"><button type="button" class="button button-quiet" id="btnExpandGroups">全部展开</button><button type="button" class="button button-quiet" id="btnCollapseGroups">全部收起</button></div>
          <p id="configResultCount" class="ops-note" role="status" aria-live="polite"></p>
        </div>
        <p class="ops-note error hidden" id="configMismatch" role="status"></p>
        <div id="configEmpty" class="search-empty hidden" role="status"><h2>没有匹配的设置</h2><p>试试更短的关键词，或搜索参数名称。</p><button type="button" class="button" id="btnClearSearch">清除搜索</button></div>
        <div id="configForm" class="config-sections" aria-label="插件参数表单" aria-busy="true"></div>
          </div>
        </div>
      </main>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
