[mypy]
python_version = 3.10
# Start with SDK-independent configuration, storage and routing primitives.
files = core/config.py, core/time_service.py, core/incompleteness.py, core/persist.py, core/topic_identity.py
# Analyze imported types, but report errors only in the modules above.
follow_imports = silent
check_untyped_defs = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True
