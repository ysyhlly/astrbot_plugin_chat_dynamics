name: Tests

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/astrbot_plugin_chat_dynamics
    env:
      PYTHONPATH: ${{ github.workspace }}/plugins
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins/astrbot_plugin_chat_dynamics
      - name: Check out the visual media integration dependency
        uses: actions/checkout@v4
        with:
          repository: ysyhlly/astrbot_plugin_visual_media
          ref: 8d4d1571bfed2132749f900b849d016d856daff6
          path: plugins/astrbot_plugin_visual_media
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt "AstrBot==4.29.4"
      - run: python scripts/check_release.py
      - run: mkdir -p artifacts
      - run: python scripts/run_checks.py backend --junitxml=artifacts/backend.xml
      - run: CHAT_DYNAMICS_REQUIRE_REAL_SDK=1 python -m pytest integration -q --junitxml=artifacts/integration.xml
      - run: python -m compileall -q main.py core tests integration scripts
      - run: python -m ruff check main.py core tests integration scripts
      - run: python -m mypy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: plugins/astrbot_plugin_chat_dynamics/artifacts/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt "AstrBot==4.29.4"
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: python scripts/run_checks.py browser --junitxml=artifacts/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/
            output/

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: chat-dynamics-release
          path: dist/
