name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_release.py --allow-empty-repo
      - run: mkdir -p artifacts
      - run: python -m pytest tests -q --junitxml=artifacts/junit-unit.xml --cov=astrbot_plugin_chat_dynamics.main --cov=astrbot_plugin_chat_dynamics.core --cov-report=json:artifacts/coverage.json
      # The host bridge must be exercised by the actual SDK, not mirrored SDK doubles.
      - run: python -m pip install "AstrBot==4.27.5"
      - run: python scripts/evaluate_routing.py --check --output artifacts/routing.json
      - run: CHAT_DYNAMICS_REQUIRE_REAL_SDK=1 python -m pytest integration -q --cov=astrbot_plugin_chat_dynamics.main --cov=astrbot_plugin_chat_dynamics.core --cov-append --cov-report=json:artifacts/coverage.json --cov-report=xml:artifacts/coverage.xml --cov-report=term --cov-fail-under=90
      - run: python scripts/check_coverage.py --json artifacts/coverage.json
      - run: python -m compileall -q main.py core tests integration scripts
      - run: python -m ruff check main.py core tests integration scripts
      - run: python -m mypy
      - run: python -c "import json; s=json.load(open('_conf_schema.json', encoding='utf-8')); assert s['pipeline_mode']['options'] == ['filter', 'exclusive']"
      - run: node --check pages/console/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-artifacts
          path: artifacts/
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: BROWSER_LOG_PATH=artifacts/browser-console.json python -m pytest tests/test_console_browser.py tests/test_topic_annotations_browser.py tests/test_replay_gantt_browser.py tests/test_config_categories_browser.py tests/test_config_simple_browser.py tests/test_secondary_workspace_browser.py tests/test_ui_theme_browser.py -q --junitxml=artifacts/junit-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: artifacts/
          if-no-files-found: ignore

  astrbot-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-version: ["4.16.0", "4.27.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt "AstrBot==${{ matrix.astrbot-version }}"
      - run: mkdir -p artifacts
      - run: python -c "import astrbot; from pathlib import Path; version=getattr(astrbot, '__version__', 'unknown'); print('AstrBot', version); Path('artifacts/astrbot-version.txt').write_text(str(version)+'\n', encoding='utf-8')"
      - run: CHAT_DYNAMICS_REQUIRE_REAL_SDK=1 python -m pytest tests integration -q --junitxml=artifacts/junit-sdk-${{ matrix.astrbot-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ matrix.astrbot-version }}-artifacts
          path: artifacts/
          if-no-files-found: ignore

  astrbot-latest-4x:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt "AstrBot>=4.16,<5"
      - run: mkdir -p artifacts
      - run: python -c "import astrbot; from pathlib import Path; version=getattr(astrbot, '__version__', 'unknown'); print('AstrBot', version); Path('artifacts/astrbot-version.txt').write_text(str(version)+'\n', encoding='utf-8')"
      - run: CHAT_DYNAMICS_REQUIRE_REAL_SDK=1 python -m pytest tests integration -q --junitxml=artifacts/junit-latest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrbot-latest-artifacts
          path: artifacts/
          if-no-files-found: ignore

  release-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: chat-dynamics-release
          path: dist/
